<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Brand Royal Blue -->
    <linearGradient id="resumintBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Mint Star Badge Gradient -->
    <linearGradient id="mintBadge" x1="36" y1="34" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Paper Shadow -->
    <filter id="paperShadow" x="10" y="8" width="44" height="50" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#091E42" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#resumintBg)" />

  <!-- Inner Soft Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Resume Sheet (White Canvas) -->
  <g filter="url(#paperShadow)">
    <path
      d="M18 11.5 C 16.62 11.5, 15.5 12.62, 15.5 14 L 15.5 48.5 C 15.5 49.88, 16.62 51, 18 51 L 44 51 C 45.38 51, 46.5 49.88, 46.5 48.5 L 46.5 20.5 L 37.5 11.5 Z"
      fill="#FFFFFF"
    />
    <!-- Folded Corner -->
    <path
      d="M37.5 11.5 L 37.5 18.5 C 37.5 19.6, 38.4 20.5, 39.5 20.5 L 46.5 20.5 Z"
      fill="#BFDBFE"
    />
    <path
      d="M37.5 20.5 L 46.5 20.5 L 37.5 11.5 Z"
      fill="#93C5FD"
      opacity="0.5"
    />
  </g>

  <!-- Resume Content Lines -->
  <!-- Name / Header (Primary Blue) -->
  <rect x="20" y="18.5" width="13.5" height="3" rx="1.5" fill="#2563EB" />

  <!-- Summary Lines -->
  <rect x="20" y="25" width="22" height="2.2" rx="1.1" fill="#64748B" />
  <rect x="20" y="30" width="18" height="2.2" rx="1.1" fill="#94A3B8" />

  <!-- Experience / Skills Accent Bars -->
  <rect x="20" y="36.5" width="15" height="2.2" rx="1.1" fill="#CBD5E1" />
  <rect x="20" y="41.5" width="11" height="2.2" rx="1.1" fill="#CBD5E1" />

  <!-- AI Mint Badge / Sparkle Seal (Bottom-Right Corner) -->
  <g>
    <!-- Badge Outer Glow & Border -->
    <circle cx="47" cy="46" r="11" fill="#1D4ED8" />
    <circle cx="47" cy="46" r="10" fill="#FFFFFF" />
    <circle cx="47" cy="46" r="8.5" fill="url(#mintBadge)" />

    <!-- Four-Pointed AI Magic Sparkle -->
    <path
      d="M47 40 C 47 43.6, 48.6 45.4, 52.2 46 C 48.6 46.6, 47 48.4, 47 52 C 47 48.4, 45.4 46.6, 41.8 46 C 45.4 45.4, 47 43.6, 47 40 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
